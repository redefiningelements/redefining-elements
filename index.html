<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Redefining Elements — Outdoor Design</title>
<meta name="description" content="Redefining Elements — Conceptual Outdoor Design. Design · Build · Connect.">

<style>
:root{
  --bg:#000;
  --text:#f5f5f5;
  --muted:#9ca3af;
  --max:1100px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
}

a{color:inherit;text-decoration:none}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:24px;
  text-align:center;
}

.heroInner{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:22px;
  padding-bottom:120px;
}

.logo{
  width:220px;
  max-width:70vw;
}

.logoSpacer{height:56px}

.slogan{
  font-size:13px;
  letter-spacing:.38em;
  text-transform:uppercase;
  color:var(--muted);
}

.hero h1{
  font-size:44px;
  font-weight:500;
  margin:0;
}

.hero p{
  max-width:760px;
  margin:14px auto 0;
  color:var(--muted);
  font-size:18px;
}

/* SCROLL INDICATOR */
.scrollIndicator{
  position:absolute;
  bottom:32px;
  opacity:.6;
  animation:scrollFloat 4.5s ease-in-out infinite;
}

.scrollIndicator img{
  width:56px;
}

@keyframes scrollFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(10px)}
}

/* VIDEO BAR */
.video-bar video{
  width:100%;
  height:30vh;
  object-fit:cover;
  display:block;
}

/* CONTENT */
.wrap{
  max-width:var(--max);
  margin:0 auto;
  padding:96px 24px;
}

h2{
  font-size:22px;
  margin-bottom:12px;
}

/* GALLERY */
.marquee{
  margin-top:32px;
  overflow:hidden;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.02);
  cursor:grab;
}

.marquee:active{cursor:grabbing}

.marqueeTrack{
  display:flex;
  gap:14px;
  padding:14px;
  width:max-content;
  animation:marquee 36s linear infinite;
}

.marquee:hover .marqueeTrack{
  animation-play-state:paused;
}

.marqueeTrack img{
  width:320px;
  height:200px;
  object-fit:cover;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.1);
  cursor:pointer;
}

@keyframes marquee{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

/* LIGHTBOX */
.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:24px;
}

.lightbox img{
  max-width:96vw;
  max-height:90vh;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.15);
  background:#000;
}

/* FOOTER */
footer{
  margin-top:160px;
  padding-bottom:40px;
  text-align:center;
  font-size:13px;
  color:var(--muted);
}

/* MOBILE */
@media (max-width:900px){
  .hero h1{font-size:34px}
  .video-bar video{height:32vh}
  .marqueeTrack img{
    width:260px;
    height:162px;
  }
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <div class="heroInner">
    <img src="assets/images/logo.png" alt="Redefining Elements logo" class="logo">
    <div class="slogan">DESIGN · BUILD · CONNECT</div>
    <div class="logoSpacer"></div>
    <h1>Re-envision your outdoor space.</h1>
    <p>
      We transform underutilized outdoor areas into intentional, buildable environments
      through thoughtful design and 3D visualization.
    </p>
  </div>

  <div class="scrollIndicator">
    <img src="assets/images/triangle.svg" alt="">
  </div>
</section>

<!-- VIDEO -->
<section class="video-bar">
  <video autoplay muted loop playsinline>
    <source src="assets/video/video-bar.mp4" type="video/mp4">
  </video>
</section>

<!-- GALLERY -->
<section class="wrap" id="gallery">
  <h2>Gallery</h2>

  <div class="marquee">
    <div class="marqueeTrack">
      <img src="assets/gallery/gallery-01.jpg">
      <img src="assets/gallery/gallery-02.jpg">
      <img src="assets/gallery/gallery-03.jpg">
      <img src="assets/gallery/gallery-04.jpg">
      <img src="assets/gallery/gallery-05.jpg">
      <img src="assets/gallery/gallery-06.jpg">

      <img src="assets/gallery/gallery-01.jpg">
      <img src="assets/gallery/gallery-02.jpg">
      <img src="assets/gallery/gallery-03.jpg">
      <img src="assets/gallery/gallery-04.jpg">
      <img src="assets/gallery/gallery-05.jpg">
      <img src="assets/gallery/gallery-06.jpg">
    </div>
  </div>
</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <img id="lightboxImg" alt="">
</div>

<footer>
  © <span id="year"></span> Redefining Elements · Design · Build · Connect
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

/* DRAG + SWIPE */
(() => {
  const marquee = document.querySelector(".marquee");
  const track = document.querySelector(".marqueeTrack");
  let isDown=false,startX;

  marquee.addEventListener("mousedown",e=>{
    isDown=true;
    startX=e.pageX;
    track.style.animationPlayState="paused";
  });

  window.addEventListener("mouseup",()=>{
    if(!isDown) return;
    isDown=false;
    track.style.transform="";
    track.style.animationPlayState="running";
  });

  window.addEventListener("mousemove",e=>{
    if(!isDown) return;
    track.style.transform=`translateX(${e.pageX-startX}px)`;
  });

  marquee.addEventListener("touchstart",e=>{
    startX=e.touches[0].pageX;
    track.style.animationPlayState="paused";
  },{passive:true});

  marquee.addEventListener("touchmove",e=>{
    track.style.transform=`translateX(${e.touches[0].pageX-startX}px)`;
  },{passive:true});

  marquee.addEventListener("touchend",()=>{
    track.style.transform="";
    track.style.animationPlayState="running";
  });
})();

/* LIGHTBOX */
(() => {
  const lb = document.getElementById("lightbox");
  const img = document.getElementById("lightboxImg");

  document.querySelectorAll(".marqueeTrack img").forEach(el=>{
    el.addEventListener("click",()=>{
      img.src = el.src;
      lb.style.display="flex";
    });
  });

  lb.addEventListener("click",()=>{
    lb.style.display="none";
    img.src="";
  });
})();
</script>

</body>
</html>
